services:
  - type: web
    name: ipo-recommendation-platform
    runtime: python
    buildCommand: "pip install -r requirements.txt && python -m ipo_platform.cli migrate"
    startCommand: "uvicorn ipo_platform.api.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: AUTH_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: "Root@123"
      - key: DATABASE_URL
        sync: false
      - key: TZ
        value: "Asia/Kolkata"
