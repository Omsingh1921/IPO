# ==============================================================================
# Docker Compose: Production & Staging Multi-Service Stack
# Services: ipo-platform (Application), mysql (Relational DB), redis (Cache/Queue)
# ==============================================================================

version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: ipo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ipo_root_password_2026}
      MYSQL_DATABASE: ${DB_NAME:-ipo_db}
      MYSQL_USER: ${DB_USER:-ipo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ipo_secure_password_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-ipo_root_password_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ipo-network

  redis:
    image: redis:7.0-alpine
    container_name: ipo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ipo-network

  ipo-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipo-platform-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://ipo_user:ipo_secure_password_2026@mysql:3306/ipo_db?charset=utf8mb4}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REPORTS_DIR: /app/reports/daily
      TZ: Asia/Kolkata
      RUN_MIGRATIONS: "true"
    volumes:
      - ./reports/daily:/app/reports/daily
    networks:
      - ipo-network
    entrypoint: ["/app/scripts/wait-for-db.sh"]
    command: ["/app/scripts/start.sh", "python", "-m", "ipo_platform.cli", "--help"]

volumes:
  mysql_data:
    driver: local

networks:
  ipo-network:
    driver: bridge
