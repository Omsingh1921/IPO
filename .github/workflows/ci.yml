name: Continuous Integration Matrix

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Python ${{ matrix.python-version }} on ${{ matrix.database.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        database:
          - name: sqlite
            url: "sqlite:///test_ci.db"
          - name: mysql
            url: "mysql+pymysql://ipo_user:ipo_password@127.0.0.1:3306/ipo_platform"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: ipo_platform
          MYSQL_USER: ipo_user
          MYSQL_PASSWORD: ipo_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      PYTHONPATH: src
      DATABASE_URL: ${{ matrix.database.url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Run Syntax and Style Linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for complexity
          flake8 src tests --count --exit-zero --max-complexity=15 --max-line-length=130 --statistics

      - name: Run Alembic Upgrade (Head)
        run: |
          python -m alembic upgrade head

      - name: Run Alembic Downgrade (Revert 1 Revision)
        run: |
          python -m alembic downgrade -- -1

      - name: Re-run Alembic Upgrade (Head)
        run: |
          python -m alembic upgrade head

      - name: Run Complete Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
